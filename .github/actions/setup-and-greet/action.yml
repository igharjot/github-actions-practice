name: Setup and Greet
description: Prints a greeting in the specified language, logs environment info, and sets a greeted output.

inputs:
  name:
    description: "Name to greet"
    required: true
  language:
    description: "Language for the greeting"
    required: false
    default: en

outputs:
  greeted:
    description: "Whether the greeting was completed"
    value: ${{ steps.set_output.outputs.greeted }}

runs:
  using: composite
  steps:
    - name: Print greeting
      shell: bash
      run: |
        case "${{ inputs.language }}" in
          en) echo "Hello, ${{ inputs.name }}!" ;;
          es) echo "¡Hola, ${{ inputs.name }}!" ;;
          fr) echo "Bonjour, ${{ inputs.name }} !" ;;
          de) echo "Hallo, ${{ inputs.name }}!" ;;
          ja) echo "こんにちは、${{ inputs.name }}！" ;;
          *)  echo "Hello, ${{ inputs.name }}! (unsupported language: ${{ inputs.language }})" ;;
        esac

    - name: Print environment info
      shell: bash
      run: |
        echo "Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo "Runner OS: ${{ runner.os }}"

    - name: Set greeted output
      id: set_output
      shell: bash
      run: echo "greeted=true" >> "$GITHUB_OUTPUT"