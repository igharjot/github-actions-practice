name: Reusable Build

on:
  workflow_call:
    inputs:
      app_name:
        type: string
        required: true
      environment:
        type: string
        required: false
        default: staging
    secrets:
      docker_token:
        required: true
    outputs:
      build_version:
        description: "Generated version string for this build"
        value: ${{ jobs.build.outputs.build_version }}    

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate build version
        id: set_version
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "build_version=v1.0-${SHORT_SHA}" >> "$GITHUB_OUTPUT"  

      - name: Print build info
        run: echo "Building ${{ inputs.app_name }} for ${{ inputs.environment }}"

      - name: Confirm Docker token is set
        run: |
          if [ -n "${{ secrets.docker_token }}" ]; then
            echo "Docker token is set: true"
          else
            echo "Docker token is set: false"
          fi