name: Scheduled Tasks

on:
    # workflow_dispatch:
    # schedule:
    #   - cron: '30 2 * * 1'    # Every Monday at 2:30 AM UTC
    #   - cron: '0 */6 * * *'   # Every 6 hours
    workflow_dispatch:

jobs:
  scheduled-health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Print triggering schedule
        run: echo "Triggered by schedule - ${{ github.event.schedule }}"

      - name: Health check
        run: |
          URL="https://example.com"
          HTTP_CODE=$(curl --silent --output /dev/null --write-out "%{http_code}" "$URL")

          echo "URL: $URL"
          echo "Response code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Health check passed ($HTTP_CODE)"
          else
            echo "❌ Health check failed ($HTTP_CODE)"
            exit 1
          fi