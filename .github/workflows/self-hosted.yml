name: Self-Hosted Runner

on:
    workflow_dispatch:

jobs:
    self:
        runs-on: [self-hosted, my-linux-runner]
        steps:
            - name: Printing Hostname and working directory 
              run: |
                echo "Hostname - ${{ runner.name }}"
                echo "Working Directory - $(pwd)"

            - name: Creating and verifying a new file
              run: |
                touch newfile.txt