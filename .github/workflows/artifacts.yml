name: Artifacts Practice

on:
    workflow_dispatch:

jobs:
    file-generation:
        runs-on: ubuntu-latest
        steps:
            - name: Generating a text file
              run: |
                mkdir -p reports
                touch reports/test-report.txt
                echo "===== TEST REPORT =====" >> reports/test-report.txt
                echo "Branch       : ${{github.ref_name}}" >> reports/test-report.txt
                echo "Date         : $(date)" >> reports/test-report.txt
                echo "Commit SHA   : ${{github.sha}}" >> reports/test-report.txt
                echo "Triggered By : ${{github.actor}}" >> reports/test-report.txt

            - name: Upload the test report
              uses: actions/upload-artifact@v4
              with:
                name: test-report
                path: reports/test-report.txt    # where to upload
                retention-days: 5

    download-and-read:
        runs-on: ubuntu-latest
        needs: file-generation
        steps:
            - name: Download test report
              uses: actions/download-artifact@v4
              with:
                name: test-report
                path: downloaded-reports/        # where to put it

            - name: Read the report
              run: cat downloaded-reports/test-report.txt