name: Docker Publish

on:
    workflow_dispatch:
    #push:
    #    - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Building Docker image
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: user/app:latest